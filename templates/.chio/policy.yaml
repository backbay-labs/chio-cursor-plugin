hushspec: "0.1.0"
name: cursor-candidate

# Policy evaluation only. Resource confinement and runtime authority are separate
# unresolved gates. Copy this policy outside the agent workspace and qualify its
# paths/tool names against the selected kernel before using protected resources.
rules:
  path_allowlist:
    enabled: true
    read:
      - src/**
      - tests/**
      - docs/**
    write:
      - src/**
      - tests/**
      - docs/**
    patch:
      - src/**
      - tests/**
      - docs/**
  forbidden_paths:
    enabled: true
    patterns:
      - "**/.env"
      - "**/.env.*"
      - "**/*.pem"
      - "**/id_rsa"
      - "**/id_ed25519"
      - "**/.chio/**"
      - "**/.cursor/**"
  shell_commands:
    enabled: true
    forbidden_patterns:
      - '(?i)\brm\s+(-[^\s]*[rf][^\s]*\s+)+'
      - '(?i)\b(curl|wget|nc|ssh)\b'
  patch_integrity:
    enabled: true
    max_additions: 2000
    max_deletions: 2000
  secret_patterns:
    enabled: true
  egress:
    enabled: true
    default: block
  tool_access:
    enabled: true
    default: block
    allow:
      - Read
      - TabRead
      - Write
      - Edit
      - Shell
